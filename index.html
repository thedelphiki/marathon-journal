<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Road to 26.2 — Training Journal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Landing page — fullscreen, shown first always -->
  <div id="landing-page" style="display:none"></div>

  <!-- Main app — hidden until landing clears it -->
  <div id="app" style="display:none"></div>

  <!-- In-app sync modal (shown from inside the app, not on landing) -->
  <div id="auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <button class="auth-close" onclick="window.MarathonAuth.hideSyncModal()">✕</button>
      <h2 id="auth-title" class="auth-title">Your Account</h2>
      <p id="auth-subtitle" class="auth-subtitle"></p>
      <div id="auth-status" style="display:none;font-size:13px;margin-bottom:12px;padding:8px 10px;border-radius:6px;background:#060a12;border:1px solid #1e293b"></div>
      <form id="auth-form" onsubmit="window.MarathonAuth.handleAuthSubmit(event)">
        <div class="auth-group">
          <label class="auth-label">Email</label>
          <input type="email" id="auth-email" class="auth-input" placeholder="runner@example.com" required autocomplete="email">
        </div>
        <div class="auth-group">
          <label class="auth-label">Password</label>
          <input type="password" id="auth-password" class="auth-input" placeholder="••••••••" required autocomplete="current-password">
          <div id="auth-password-hint" style="display:none;font-size:11px;color:#475569;margin-top:4px">Min. 8 characters · one uppercase · one number</div>
        </div>
        <div style="text-align:right;margin-bottom:16px">
          <a class="auth-switch-link" style="font-size:12px;color:#64748b" onclick="window.MarathonAuth.handleForgotPassword()">Forgot password?</a>
        </div>
        <button type="submit" id="auth-btn" class="auth-btn">Log In</button>
      </form>
      <div id="auth-logged-in-state" style="display:none;text-align:center">
        <div style="font-size:36px;margin-bottom:10px">☁️</div>
        <p style="font-size:13px;color:#94a3b8;margin-bottom:4px">Signed in as</p>
        <p id="auth-user-email" style="font-size:14px;color:#4ade80;font-weight:bold;margin-bottom:20px;word-break:break-all"></p>
        <button class="auth-btn" style="background:#ef4444" onclick="window.MarathonAuth.handleLogout()">Sign Out</button>
      </div>
      <div id="auth-switch" class="auth-switch">
        Don't have an account? <a class="auth-switch-link" onclick="window.MarathonAuth.toggleAuthMode()">Sign Up</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (all needed ones) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>

  <!-- App scripts — order matters -->
  <script src="firebase-config.js"></script>
  <script src="profile.js"></script>
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script src="onboarding.js"></script>
  <script src="tour.js"></script>
  <script src="app.js"></script>
  <script src="landing.js"></script>

</body>
</html>
